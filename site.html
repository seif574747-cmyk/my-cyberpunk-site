<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obito Login - Cyberpunk</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Noto Sans Arabic", sans-serif;
}

body{
  background:#000;
  height:100vh;
  overflow:hidden;
  perspective:900px;
}

/* خلفية نيون متحركة */
.bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%, #2a00ff, #000 70%);
  animation:bgMove 6s infinite alternate ease-in-out;
  filter:blur(80px);
  z-index:-2;
}
@keyframes bgMove{
  0%{transform:scale(1);}
  100%{transform:scale(1.4);}
}

/* تأثير خطوط سايبربانك */
.scanlines{
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(0,0,0,0) 50%, rgba(255,0,200,0.1) 50%);
  background-size:100% 4px;
  opacity:0.4;
  pointer-events:none;
  z-index:50;
}

/* الحاوية */
.container{
  width:380px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(255,0,204,0.3);
  box-shadow:0 0 25px #8a00ff;
  border-radius:20px;
  padding:30px;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  backdrop-filter:blur(16px);
  text-align:center;
  color:#fff;
  transition:0.2s;
}

/* تأثير تحريك ثلاثي الأبعاد */
body:hover .container{
  transform-style:preserve-3d;
}

/* صورة أوبيتو */
.obito{
  width:150px;
  height:150px;
  margin:0 auto 20px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 0 20px #ff00e6;
  animation:float 4s infinite ease-in-out;
}
.obito img{
  width:100%;height:100%;object-fit:cover;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
  100%{transform:translateY(0);}
}

/* عنوان */
h1{
  font-size:26px;
  margin-bottom:20px;
  text-shadow:0 0 10px #ff00e6;
}

/* المدخلات */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  background:rgba(255,255,255,0.07);
  border-radius:12px;
  color:#fff;
  outline:none;
  box-shadow:0 0 10px #8a00ff;
  transition:.2s;
}
input:focus{
  box-shadow:0 0 18px #ff00e6;
}

/* زر الدخول */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:linear-gradient(90deg,#4100ff,#ff00aa);
  border:none;
  color:#fff;
  font-size:18px;
  font-weight:700;
  border-radius:10px;
  box-shadow:0 0 20px #ff00f2;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 28px #d400ff;
}

/* نص تحت الزر */
small{
  display:block;
  margin-top:12px;
  opacity:0.7;
}

/* تأثير تحريك الكاميرا */
</style>
</head>
<body>

<div class="bg"></div>
<div class="scanlines"></div>

<div class="container" id="panel">

  <div class="obito">
    <img src="obito-mask.png" alt="Obito" onerror="this.src='https://via.placeholder.com/150/000?text=Obito+Mask'">
  </div>

  <h1>تسجيل دخول — عالم أوبيتو</h1>

  <input type="text" placeholder="اسم المستخدم">
  <input type="password" placeholder="كلمة السر">

  <button onclick="login()">دخول</button>

  <small>⚡ نظام تسجيل دخول سايبربانك متطور</small>
</div>


<script>
/* تأثير الكاميرا ثلاثي الأبعاد */
const panel = document.getElementById("panel");
document.addEventListener("mousemove", e=>{
  
  let x = (window.innerWidth / 2 - e.pageX) / 40;
  let y = (window.innerHeight / 2 - e.pageY) / 20;

  panel.style.transform = 
  `translate(-50%, -50%) rotateY(${x}deg) rotateX(${y}deg)`;
});

/* زر الدخول */
function login(){
  alert("🔮 تم الاختراق والدخول بنجاح إلى عالم أوبيتو");
}
</script>

</body>
</html>
